    <!--
      Structured data: tells Google directly that this page is about a
      person named Kelvin Tadiwanashe Muchabaya -- this is the single
      strongest signal for a name search to surface this page specifically,
      rather than Google having to infer it purely from rendered text (which
      is unreliable here since real content only appears after the user
      clicks past the boot sequence -- see BootSequence.jsx for the
      always-present fallback that covers that gap).
      Every field below is a fact already stated in src/data/profile.js --
      nothing here is invented, and sameAs only includes links that are
      actually real and confirmed (GitHub). Add LinkedIn to sameAs once you
      have a real URL for it in profile.js -- never add a placeholder one.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Kelvin Tadiwanashe Muchabaya",
      "alternateName": "Kelvin T. Muchabaya",
      "jobTitle": "Mechatronics Engineering Student",
      "description": "Kelvin T. Muchabaya is a Mechatronics Engineering student at Chinhoyi University of Technology, Zimbabwe, exploring AI, robotics, embedded systems and engineering.",
      "url": "https://the-sage-portfolio.vercel.app/",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Chinhoyi University of Technology"
      },
      "sameAs": [
        "https://github.com/OtakuSensei05"
      ]
    }
    </script>
